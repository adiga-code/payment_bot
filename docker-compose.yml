version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payment_bot_db
    
    environment:
      POSTGRES_DB: payment_bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: your_secure_password_here
      PGDATA: /var/lib/postgresql/data/pgdata
    
    ports:
      - "5435:5432"  # Внешний порт 5435 → внутренний 5432
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql  # SQL при первом запуске
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d payment_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - bot_network

  # Опционально: pgAdmin для управления БД
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payment_bot_pgadmin
    
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    
    ports:
      - "5050:80"
    
    depends_on:
      - postgres
    
    restart: unless-stopped
    
    networks:
      - bot_network

volumes:
  postgres_data:
    driver: local

networks:
  bot_network:
    driver: bridge